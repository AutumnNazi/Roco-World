name: 数据同步（远行商人/图鉴/立绘）

# 站点以 nginx 纯静态托管（服务器上没有 Node 进程），所以数据刷新只能由仓库侧完成：
# 本工作流按点抓取并提交，页面在本地数据过期时直接从 GitHub 原始文件兜底读取。
# 开市时段（北京 08:00-23:00）每 30 分钟一次；GitHub 排队高峰会有几分钟延迟，属正常。
on:
  schedule:
    - cron: "*/30 0-15 * * *" # UTC 00:00-15:30 = 北京 08:00-23:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci --legacy-peer-deps

      - name: 同步远行商人数据
        run: npm run sync:merchant-data

      - name: 同步官方图鉴档案
        run: npm run sync:official-pokedex

      - name: 补充缺失精灵立绘
        # BWIKI 有限频，补图失败不应拖累商人数据的提交。
        continue-on-error: true
        run: npm run sync:pet-images

      - name: 检查数据是否有变化
        id: changes
        run: |
          git config --local user.name "AutumnNazi"
          git config --local user.email "104422820+AutumnNazi@users.noreply.github.com"
          if git diff --quiet -- public/data public/assets; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送数据更新
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add public/data public/assets
          git commit -m "🔄 data: 定时同步商人/图鉴/立绘数据"
          git push
