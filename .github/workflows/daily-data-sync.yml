name: 数据同步（远行商人/图鉴/立绘）

# 图鉴档案与立绘补图属于重活（BWIKI 有限频、单次数分钟），每天跑一次即可。
# 远行商人的高频刷新在 merchant-sync.yml（每 5 分钟），两者互不干扰。
on:
  schedule:
    - cron: "20 20 * * *" # UTC 20:20 = 北京次日 04:20，低峰时段
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci --legacy-peer-deps

      - name: 同步远行商人数据
        run: npm run sync:merchant-data

      - name: 同步官方图鉴档案
        run: npm run sync:official-pokedex

      - name: 补充缺失精灵立绘
        # BWIKI 有限频，补图失败不应拖累商人数据的提交。
        continue-on-error: true
        run: npm run sync:pet-images

      - name: 检查数据是否有变化
        id: changes
        run: |
          git config --local user.name "AutumnNazi"
          git config --local user.email "104422820+AutumnNazi@users.noreply.github.com"
          if git diff --quiet -- public/data public/assets; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送数据更新
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add public/data public/assets
          git commit -m "🔄 data: 定时同步商人/图鉴/立绘数据"
          # 两个 workflow 的 concurrency group 互不阻塞，手动触发本任务时可能
          # 撞上 merchant-sync 刚推的提交。不 rebase 会让图鉴/立绘这次更新整轮丢掉，
          # 要等到第二天 04:20 才有机会再入库。
          git pull --rebase --autostash origin main
          git push
