name: 数据同步（远行商人/图鉴/立绘）

# 商人数据每日 8/12/16/20 点（北京时间）轮换，且源站是渐进上架。
# GitHub 的 schedule 可能延迟或漏触发，所以用「高频轮询 + 无变化不提交」
# 换取自我修复：每次运行都会重新解析源站，数据没变就跳过提交，成本极低。
on:
  schedule:
    # 每 30 分钟一次，覆盖北京时间 08:00-22:30（UTC 00:00-14:30）的营业时段。
    - cron: "*/30 0-14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci --legacy-peer-deps

      - name: 同步远行商人数据
        run: npm run sync:merchant-data

      - name: 同步官方图鉴档案
        run: npm run sync:official-pokedex

      - name: 补充缺失精灵立绘
        # BWIKI 有限频，补图失败不应拖累商人数据的提交。
        continue-on-error: true
        run: npm run sync:pet-images

      - name: 检查数据是否有变化
        id: changes
        run: |
          git config --local user.name "AutumnNazi"
          git config --local user.email "104422820+AutumnNazi@users.noreply.github.com"
          if git diff --quiet -- public/data public/assets; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送数据更新
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add public/data public/assets
          git commit -m "🔄 data: 定时同步商人/图鉴/立绘数据"
          git push
