name: 数据同步（远行商人/图鉴/立绘）

# 站点部署在本机，日常数据刷新由 scripts/serve-local.mjs 在本地按点完成
# （详见 README「本地部署」），本工作流改成手动触发，用于仓库侧一次性刷新：
# 若将来改为托管部署，把 schedule 打开即可恢复自动同步。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci --legacy-peer-deps

      - name: 同步远行商人数据
        run: npm run sync:merchant-data

      - name: 同步官方图鉴档案
        run: npm run sync:official-pokedex

      - name: 补充缺失精灵立绘
        # BWIKI 有限频，补图失败不应拖累商人数据的提交。
        continue-on-error: true
        run: npm run sync:pet-images

      - name: 检查数据是否有变化
        id: changes
        run: |
          git config --local user.name "AutumnNazi"
          git config --local user.email "104422820+AutumnNazi@users.noreply.github.com"
          if git diff --quiet -- public/data public/assets; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送数据更新
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add public/data public/assets
          git commit -m "🔄 data: 定时同步商人/图鉴/立绘数据"
          git push
